[project]
name = "xau-bot"
version = "0.1.0"
description = "Intelligent XAUUSDT trading bot for Binance USDT-M Futures"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "ccxt>=4.3.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlmodel>=0.0.16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "websockets>=12.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
backtest = ["vectorbt>=0.26"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "freezegun>=1.5"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "tests*", ".venv*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
